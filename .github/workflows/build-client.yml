# Builds the client mod JAR
name: build-client
on:
  push:
    branches: [ "master" ]
jobs:
  build-client:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: [ 25 ]
      fail-fast: true
    steps:
      - name: Checkout Git repository
        uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        continue-on-error: true
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Install AdvanceCOMP (for advzip)
        run: sudo apt-get update && sudo apt-get install -y advancecomp
      - name: Build and compress
        run: ./gradlew :spoutcraft-multiloader:recompressJar
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: Spoutcraft JAR
          path: |
            spoutcraft/build/libs/spoutcraft-*.jar
            !spoutcraft/build/libs/spoutcraft-*-sources.jar
          archive: false
